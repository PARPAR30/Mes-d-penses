name: Tester puis déployer le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Les tests pilotent un vrai Chrome (celui des runners Ubuntu) à la taille d'un iPhone.
  # Rien n'est déployé tant qu'ils ne passent pas : une régression ne part plus en ligne.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24 (WebSocket natif, sans dépendance)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Régressions (npm test)
        run: npm test

      - name: Audit de mise en page (débordements, cibles tactiles, texte coupé)
        run: npm run audit

      - name: Journal des tests en cas d'échec
        if: failure()
        run: ls -la tests/navigateur || true

  deploy:
    needs: test
    # une pull request se teste, mais ne publie rien
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Empaqueter web/
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Déployer
        id: deploy
        uses: actions/deploy-pages@v5
