name: Build macOS DMG

# manuel uniquement : les paquets desktop se construisent sur le PC
# (npm run build), pas automatiquement sur GitHub à chaque push
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build macOS app (binaire universel)
        run: npm run build -- --target universal-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Budget-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
